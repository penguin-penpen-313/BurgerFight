<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#86CDBE">
<title>つみつみバーガー</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261015">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body data-role="player">
<div id="safe-probe"></div>
<canvas id="game" aria-label="ゲーム画面"></canvas>

<section class="screen" id="screen-title">
  <div class="card">
    <h1 class="logo" aria-label="つみつみバーガー">
      <span class="logo-top">つみつみ</span>
      <span class="logo-lettuce" aria-hidden="true"></span>
      <span class="logo-cheese" aria-hidden="true"></span>
      <span class="logo-patty" aria-hidden="true"></span>
      <span class="logo-bottom">バーガー</span>
    </h1>

    <div id="master-controls" hidden>
      <div class="timer-set" role="group" aria-label="制限時間">
        <button id="time-minus" type="button" aria-label="30秒へらす">−</button>
        <output id="time-value" aria-live="polite">2:00</output>
        <button id="time-plus" type="button" aria-label="30秒ふやす">＋</button>
      </div>
      <button id="btn-play" class="btn-main" type="button">プレイ</button>
    </div>

    <div id="player-wait" hidden>
      <p id="wait-text" class="wait">接続中…</p>
    </div>

    <button id="btn-practice" class="btn-sub" type="button">練習</button>
    <p id="net-status" class="net"></p>
  </div>
</section>

<section class="screen screen-tutorial" id="screen-tutorial" hidden>
  <div id="tut-ring" class="tut-ring" hidden></div>
  <div id="tut-card" class="tut-card" role="dialog" aria-labelledby="tut-title">
    <p id="tut-step" class="tut-step">1 / 6</p>
    <h2 id="tut-title" class="tut-title"></h2>
    <p id="tut-text" class="tut-text"></p>
    <div class="tut-actions">
      <button id="tut-skip" class="btn-text" type="button">スキップ</button>
      <button id="tut-next" class="btn-small" type="button">つぎへ</button>
    </div>
  </div>
</section>

<section class="screen screen-count" id="screen-count" hidden>
  <div id="count-num" class="count">10</div>
</section>

<section class="screen" id="screen-result" hidden>
  <div class="card result">
    <h2 class="result-title">タイムアップ！</h2>
    <div class="mine">
      <div><span>あなたのスコア</span><strong id="my-score">0</strong></div>
      <div><span>つくったバーガー</span><strong id="my-count">0個</strong></div>
    </div>
    <div id="gallery" class="gallery" tabindex="0" aria-label="つくったバーガー（左右にスワイプ）"></div>
    <p id="gallery-hint" class="gallery-hint" hidden>左右にスワイプでほかのバーガー</p>
    <div class="team">
      <p id="team-wait" class="wait">結果発表を待っています</p>
      <div id="team-block" hidden>
        <div class="team-row">
          <div class="team-total">
            <p class="team-label">みんなの合計スコア</p>
            <p id="team-score" class="team-score">0</p>
          </div>
          <div id="equiv" class="equiv" hidden>
            <p class="team-label">バーガー</p>
            <p class="equiv-num"><canvas id="equiv-icon" aria-hidden="true"></canvas><strong id="equiv-count">0</strong><span>個分</span></p>
          </div>
        </div>
        <p id="team-meta" class="team-meta"></p>
      </div>
    </div>
    <button id="btn-reveal" class="btn-main" type="button" hidden>結果発表</button>
    <button id="btn-back" class="btn-sub" type="button" hidden>タイトルへ</button>
    <p id="next-hint" class="next-hint" hidden>マスターが次のゲームを始めると自動でカウントダウン</p>
  </div>
</section>

<script type="module" src="js/app.js?v=20261015"></script>
</body>
</html>
